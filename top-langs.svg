<svg
  width="300"
  height="165"
  viewBox="0 0 300 165"
  fill="none"
  xmlns="http://www.w3.org/2000/svg"
  role="img"
  aria-labelledby="titleId"
>
  <title id="titleId">Most Used Languages</title>
  <style>
    .header {
      font: 600 18px 'Segoe UI', Ubuntu, Sans-Serif;
      fill: #6366F1;
      animation: fadeInAnimation 0.8s ease-in-out forwards;
    }
    @supports(-moz-appearance: auto) {
      .header { font-size: 15.5px; }
    }
    @keyframes slideInAnimation {
      from { width: 0; }
      to { width: calc(100% - 100px); }
    }
    @keyframes growWidthAnimation {
      from { width: 0; }
      to { width: 100%; }
    }
    .lang-name {
      font: 400 11px "Segoe UI", Ubuntu, Sans-Serif;
      fill: #a9fef7;
    }
    .stagger {
      opacity: 0;
      animation: fadeInAnimation 0.3s ease-in-out forwards;
    }
    #rect-mask rect {
      animation: slideInAnimation 1s ease-in-out forwards;
    }
    .lang-progress {
      animation: growWidthAnimation 0.6s ease-in-out forwards;
    }
    @keyframes fadeInAnimation {
      from { opacity: 0; }
      to { opacity: 1; }
    }
  </style>

  <rect
    data-testid="card-bg"
    x="0.5"
    y="0.5"
    rx="4.5"
    height="99%"
    stroke="#e4e2e2"
    width="299"
    fill="#0d1117"
    stroke-opacity="0"
  />

  <g data-testid="card-title" transform="translate(25, 35)">
    <text x="0" y="0" class="header" data-testid="header">Most Used Languages</text>
  </g>

  <g data-testid="main-card-body" transform="translate(0, 55)">
    <svg data-testid="lang-items" x="25">
      <mask id="rect-mask">
        <rect x="0" y="0" width="250" height="8" fill="white" rx="5"/>
      </mask>
      
      <rect mask="url(#rect-mask)" class="lang-progress" x="0.00" y="0" width="228.00" height="8" fill="#3178c6" />
      <rect mask="url(#rect-mask)" class="lang-progress" x="228.00" y="0" width="13.37" height="8" fill="#663399" />
      <rect mask="url(#rect-mask)" class="lang-progress" x="241.37" y="0" width="8.31" height="8" fill="#e34c26" />
      <rect mask="url(#rect-mask)" class="lang-progress" x="249.68" y="0" width="0.27" height="8" fill="#384d54" />

      <!-- Language Legend Grid -->
      <g transform="translate(0, 25)">
        <g transform="translate(0, 0)">
          <g class="stagger" style="animation-delay: 450ms">
            <circle cx="5" cy="6" r="5" fill="#3178c6" />
            <text x="15" y="10" class="lang-name">TypeScript 91.20%</text>
          </g>
        </g>
        <g transform="translate(135, 0)">
          <g class="stagger" style="animation-delay: 600ms">
            <circle cx="5" cy="6" r="5" fill="#663399" />
            <text x="15" y="10" class="lang-name">CSS 5.35%</text>
          </g>
        </g>
        <g transform="translate(0, 25)">
          <g class="stagger" style="animation-delay: 750ms">
            <circle cx="5" cy="6" r="5" fill="#e34c26" />
            <text x="15" y="10" class="lang-name">HTML 3.33%</text>
          </g>
        </g>
        <g transform="translate(135, 25)">
          <g class="stagger" style="animation-delay: 900ms">
            <circle cx="5" cy="6" r="5" fill="#384d54" />
            <text x="15" y="10" class="lang-name">Dockerfile 0.11%</text>
          </g>
        </g>
      </g>
    </svg>
  </g>
</svg>
